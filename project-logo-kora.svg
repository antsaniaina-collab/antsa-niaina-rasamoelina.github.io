<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Planche de présentation du logo Kora Café">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141413" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Fond neutre studio -->
  <rect width="800" height="600" fill="#EBE7DF"/>

  <!-- Planche principale blanche -->
  <rect x="48" y="42" width="704" height="516" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- En-tête technique -->
  <text x="80" y="82" fill="#7A756D" font-family="monospace" font-size="11" letter-spacing="2">PLANCHE DE PRÉSENTATION LOGO · 01</text>
  <text x="720" y="82" text-anchor="end" fill="#7A756D" font-family="monospace" font-size="11" letter-spacing="1.5">VECTORIEL · AI / SVG</text>
  <line x1="80" y1="98" x2="720" y2="98" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Zone grille centrale + Logo principal -->
  <g opacity="0.35">
    <line x1="400" y1="120" x2="400" y2="338" stroke="#C5BFB3" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="160" y1="224" x2="640" y2="224" stroke="#C5BFB3" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="322" cy="224" r="56" fill="none" stroke="#C5BFB3" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Symbole géométrique Kora Café (tasse + soleil levant) -->
  <g transform="translate(278, 180)">
    <path d="M12 42 C12 20, 76 20, 76 42 Z" fill="#B8502C"/>
    <path d="M8 48 H80 C80 72, 66 86, 44 86 C22 86, 8 72, 8 48 Z" fill="#1C1B19"/>
    <path d="M80 54 H88 C95 54, 98 60, 98 66 C98 72, 94 77, 86 77 H76" fill="none" stroke="#1C1B19" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Typographie du logo -->
  <text x="404" y="232" fill="#1C1B19" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="48" letter-spacing="6">KORA</text>
  <text x="406" y="258" fill="#B8502C" font-family="monospace" font-size="13" font-weight="600" letter-spacing="5">CAFÉ &amp; COMPTOIR</text>

  <!-- Ligne de séparation -->
  <line x1="80" y1="352" x2="720" y2="352" stroke="#E5E1D8" stroke-width="1"/>

  <!-- 3 vignettes déclinaisons en bas -->
  <!-- Vignette 1 : Monochrome sombre -->
  <rect x="80" y="376" width="196" height="146" rx="6" fill="#F7F5F0" stroke="#E5E1D8"/>
  <g transform="translate(152, 412) scale(0.55)">
    <path d="M12 42 C12 20, 76 20, 76 42 Z" fill="#1C1B19"/>
    <path d="M8 48 H80 C80 72, 66 86, 44 86 C22 86, 8 72, 8 48 Z" fill="#1C1B19"/>
    <path d="M80 54 H88 C95 54, 98 60, 98 66 C98 72, 94 77, 86 77 H76" fill="none" stroke="#1C1B19" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="178" y="486" text-anchor="middle" fill="#1C1B19" font-family="Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="2.5">KORA</text>
  <text x="178" y="508" text-anchor="middle" fill="#7A756D" font-family="monospace" font-size="9">VERSION NOIR</text>

  <!-- Vignette 2 : Négatif sur fond sombre -->
  <rect x="302" y="376" width="196" height="146" rx="6" fill="#1C1B19"/>
  <g transform="translate(374, 412) scale(0.55)">
    <path d="M12 42 C12 20, 76 20, 76 42 Z" fill="#E39A74"/>
    <path d="M8 48 H80 C80 72, 66 86, 44 86 C22 86, 8 72, 8 48 Z" fill="#FFFFFF"/>
    <path d="M80 54 H88 C95 54, 98 60, 98 66 C98 72, 94 77, 86 77 H76" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="400" y="486" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="2.5">KORA</text>
  <text x="400" y="508" text-anchor="middle" fill="#A8A39A" font-family="monospace" font-size="9">VERSION FOND SOMBRE</text>

  <!-- Vignette 3 : Palette couleurs -->
  <rect x="524" y="376" width="196" height="146" rx="6" fill="#F7F5F0" stroke="#E5E1D8"/>
  <rect x="544" y="398" width="44" height="64" rx="4" fill="#1C1B19"/>
  <rect x="600" y="398" width="44" height="64" rx="4" fill="#B8502C"/>
  <rect x="656" y="398" width="44" height="64" rx="4" fill="#F5EFE6" stroke="#D8D2C7"/>
  <text x="566" y="482" text-anchor="middle" fill="#5A5750" font-family="monospace" font-size="8.5">#1C1B19</text>
  <text x="622" y="482" text-anchor="middle" fill="#5A5750" font-family="monospace" font-size="8.5">#B8502C</text>
  <text x="678" y="482" text-anchor="middle" fill="#5A5750" font-family="monospace" font-size="8.5">#F5EFE6</text>
  <text x="622" y="508" text-anchor="middle" fill="#7A756D" font-family="monospace" font-size="9">PALETTE COULEURS</text>
</svg>
